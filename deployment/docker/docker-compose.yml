services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trimatlas
      POSTGRES_USER: trimatlas
      POSTGRES_PASSWORD: trimatlas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimatlas -d trimatlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://trimatlas:trimatlas@postgres:5432/trimatlas
      AUTH_JWT_SECRET: development-secret-change-before-production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
